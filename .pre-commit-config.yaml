# Hooks for `prek` (or `pre-commit`; the config format is the same).
#
#   prek install     enable them for this clone (both shims, see below)
#   prek run --all-files
#
# Deliberately short. A hook per test script duplicates `noxfile.py`, which already owns the
# suite, and the duplicate drifts: every new test needed an entry in both places, and the
# `files:` pattern beside it was a second, subtler thing to get wrong. Test selection now
# lives in pytest and nox alone.
#
# On commit, `nox -s quick` runs the Lean-free part of the suite in about a second, and
# `nox -s skills` validates and security-scans the skill when it changes. On push, lint,
# format and types run, which take seconds. The Lean-backed tests need a built checkout and
# take minutes, too long to wait for on every push; the release workflow runs them on `main`,
# and `nox -s tests` runs them locally.
#
# Skippable in an emergency with `SKIP=nox-quick git commit` or `SKIP=nox-static git push`.
#
# Three shims are installed. `commit-msg` runs the Conventional Commits check, `pre-push`
# the static checks, and `pre-commit` the rest; declaring them here means `prek install` wires
# them all up, rather than a hook sitting in this file uninstalled and silently never running.

default_install_hook_types: [pre-commit, commit-msg, pre-push]
# Hooks without `stages:` would otherwise run at every installed stage, repeating the
# commit checks while checking the message and again before the push.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      # These three declare their own stages, which take precedence over `default_stages`.
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: debug-statements

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.1
    hooks:
      # Subjects must say what kind of change they are, so a release tool can read the
      # history. The body is unconstrained and remains the valuable part.
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: nox-quick
        name: Lean-free tests (nox -s quick)
        # The checkout's own nox first, then PATH. A hook inherits whatever environment the
        # commit was made from, which for an agent — or for `.venv/bin/prek run` — need not
        # have the virtualenv on PATH. `tests/test_entrypoints.py` exists because that
        # assumption failed before.
        entry: sh -c 'if [ -x .venv/bin/nox ]; then exec .venv/bin/nox -s quick; fi; exec nox -s quick'
        language: system
        pass_filenames: false
        # Prose can go stale as easily as code — `tests/test_names.py` exists because it did —
        # so this runs on every commit rather than only when Python changes.
        always_run: true

      - id: nox-skills
        name: Agent Skill validation and scan (nox -s skills)
        entry: sh -c 'if [ -x .venv/bin/nox ]; then exec .venv/bin/nox -s skills; fi; exec nox -s skills'
        language: system
        files: ^skills/
        pass_filenames: false

      - id: nox-static
        name: Lint, format and types (nox -s lint format types)
        entry: sh -c 'if [ -x .venv/bin/nox ]; then exec .venv/bin/nox -s lint format types; fi; exec nox -s lint format types'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
