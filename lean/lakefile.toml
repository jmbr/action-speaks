name = "nullius"
version = "0.1.0"
defaultTargets = ["Nullius"]

[[lean_lib]]
name = "Nullius"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

# The REPL is the verification backend. Requiring it here rather than cloning it by hand
# means lake fetches it, pins the exact revision in lake-manifest.json, and guarantees it is
# built against the same toolchain as this project - a mismatch silently breaks elaboration.
# This revision is the one whose lean-toolchain is v4.33.0.
[[require]]
name = "repl"
git = "https://github.com/leanprover-community/repl"
rev = "bbeedf38e0898869fc3b7c009e1ea877b46204e4"
