name = "nullius"
version = "0.1.0"
defaultTargets = ["Nullius"]

[[lean_lib]]
name = "Nullius"

# The root module for local lemma search: it imports Mathlib, Physlib and the audit module,
# so a Loogle index built from it covers exactly what a submission can refer to. Nothing
# depends on it, and it is not part of `defaultTargets` — `scripts/build-loogle.sh` builds
# it on demand.
[[lean_lib]]
name = "NulliusAll"


[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

# The REPL is the verification backend. Requiring it here rather than cloning it by hand
# means lake fetches it, pins the exact revision in lake-manifest.json, and guarantees it is
# built against the same toolchain as this project - a mismatch silently breaks elaboration.
# This revision is the one whose lean-toolchain is v4.33.0.
[[require]]
name = "repl"
git = "https://github.com/leanprover-community/repl"
rev = "bbeedf38e0898869fc3b7c009e1ea877b46204e4"

# Physlib is the physics library. It is pinned to an exact commit rather than a branch
# because it ships deliberately incomplete results - `sorryful` (`sorryAx`), `pseudo`
# (`Lean.ofReduceBool`) and `semiformal_result` (an inconsistent `axiom helper : α`) - and
# which results are complete changes over time. A ledger entry only means something if the
# revision it was checked against is known. The audit rejects all three kinds anyway, since
# none of those axioms is in `Nullius.Audit.trustedAxioms`.
#
# Physlib sets the toolchain floor: it tracks Mathlib a release behind, so v4.33.0 above is
# its constraint, not ours. Revisit both pins together when it bumps.
[[require]]
name = "Physlib"
git = "https://github.com/leanprover-community/physlib"
rev = "98fbbee20d0a376ea9160408517a48e274df1663"

# Cslib is the computer science library: models of computation, lambda calculi, process
# calculi, automata, and verified algorithms. It covers the half of this tool's remit -
# algorithm correctness and termination arguments - that Mathlib serves only incidentally.
#
# The pin is the `v4.33.0` release tag, by commit rather than tag name so it cannot move.
# Cslib tags a release per toolchain, and this one requires mathlib v4.33.0 - the exact
# revision Physlib requires and this project already builds. Lake admits one mathlib in the
# graph, so that agreement is what makes the three coexist at all. Later Cslib tags move
# mathlib forward and would break that agreement, and `main` is further ahead still. Bump
# this only in step with the toolchain, and check the mathlib revision still matches before
# believing it works.
#
# Unlike Physlib it ships no deliberate placeholders: no `sorry`, no declared axioms, no
# `native_decide`. The audit is unchanged regardless, since it trusts a fixed axiom list
# rather than a list of libraries.
[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "3951377e5a3f5772737f11cd62bc5bb6a72f95d1"
