name = "ActionSpeaks"
version = "0.1.0"
defaultTargets = ["ActionSpeaks"]

[[lean_lib]]
name = "ActionSpeaks"

# The root module for local lemma search: it imports every library and the audit module,
# so a Loogle index built from it covers exactly what a submission can refer to. Nothing
# depends on it, and it is not part of `defaultTargets` — `scripts/build-loogle.sh` builds
# it on demand.
[[lean_lib]]
name = "ActionSpeaksAll"


# The REPL is the verification backend. Requiring it here rather than cloning it by hand
# means lake fetches it, pins the exact revision in lake-manifest.json, and guarantees it is
# built against the same toolchain as this project - a mismatch silently breaks elaboration.
# This revision is its `v4.35.0` tag, by commit so it cannot move.
[[require]]
name = "repl"
git = "https://github.com/leanprover-community/repl"
rev = "58bdde1ff173117960083cc5a052a11d51c49ff1"

# Physlib is the physics library. It is pinned to an exact commit rather than a branch
# because it ships deliberately incomplete results - `sorryful` (`sorryAx`), `pseudo`
# (`Lean.ofReduceBool`) and `semiformal_result` (an inconsistent `axiom helper : α`) - and
# which results are complete changes over time. A ledger entry only means something if the
# revision it was checked against is known. The audit rejects all three kinds anyway, since
# none of those axioms is in `ActionSpeaks.Audit.trustedAxioms`.
#
# Physlib usually sets the toolchain floor, since it tracks Mathlib a release behind. This pin
# is its `v4.35.0` tag, by commit so it cannot move. `scripts/check_updates.py` reports when it
# moves, and which release every required library can agree on.
[[require]]
name = "Physlib"
git = "https://github.com/leanprover-community/physlib"
rev = "af04d60bcd7618af849ff511e0a19d77f709937e"

# Cslib is the computer science library: models of computation, lambda calculi, process
# calculi, automata, and verified algorithms. It covers the half of this tool's remit -
# algorithm correctness and termination arguments - that Mathlib serves only incidentally.
#
# The pin is the `v4.35.0` release tag, by commit rather than tag name so it cannot move.
# Cslib tags a release per toolchain, and this one requires mathlib v4.35.0 - the exact
# revision Physlib requires and this project already builds. Lake admits one mathlib in the
# graph, so that agreement is what makes the three coexist at all. Later Cslib tags move
# mathlib forward and would break that agreement, and `main` is further ahead still. Bump
# this only in step with the toolchain, and check the mathlib revision still matches before
# believing it works.
#
# Unlike Physlib it ships no deliberate placeholders: no `sorry`, no declared axioms, no
# `native_decide`. The audit is unchanged regardless, since it trusts a fixed axiom list
# rather than a list of libraries.
[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "5b56df99362532c46e1175381fbbdd755bd56030"

# Statlib is the statistics library: e-values, contiguity, quadratic mean differentiability,
# risk and inference. It covers claims about estimators and tests that Mathlib's probability
# theory supports but does not state.
#
# Unlike the libraries above, Statlib tags only some releases and none at v4.35.0, so this is
# a commit on `main`. That commit asks for mathlib 051bc08, 42 commits behind v4.35.0 on the
# same line; the root package decides which mathlib Lake builds, so Statlib is compiled against
# v4.35.0 here, not against what its own CI checked. That is safe only because a build failure
# would be loud, and the suite builds it. It ships no `sorry`, axioms or `native_decide`.
#
# It requires SubVerso at a moving `main`, for its Verso tutorial only; the library imports
# nothing from it. lake-manifest.json pins the resolved commit, so builds stay reproducible.
[[require]]
name = "Statlib"
git = "https://github.com/stat-lib/statlib"
rev = "ee032e7f26852bf6abfa3b90dc1d9f13740734b8"

# Last on purpose. Lake resolves Mathlib's own dependencies (Batteries, Aesop, Qq, ...) from
# whichever manifest it reads last, and Statlib's pins those for a different mathlib commit.
# Requiring mathlib last makes v4.35.0's own manifest decide them.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"
