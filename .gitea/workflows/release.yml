name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# This runner's schema supports only the read-all/write-all shorthand. A release must push
# its commit and tag and create the release, so read-only is insufficient.
permissions: write-all

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ forgejo.token }}

      # The release commit triggers this workflow once more. It contains no releasable change,
      # but skipping the expensive Lean build is better than discovering that six minutes later.
      - name: Decide whether to run
        id: guard
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "chore(release): "* ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Lean build
        id: lean-cache
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            lean/.lake/build
            lean/.lake/packages/Physlib
            lean/.lake/packages/cslib
            lean/.lake/packages/floatlib
            lean/.lake/packages/repl
            vendor/loogle
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'scripts/build-loogle.sh') }}
          restore-keys: |
            lean-${{ runner.os }}-

      - name: Install Python tooling
        if: steps.guard.outputs.run == 'true'
        run: |
          apt-get update
          apt-get install -y python3-venv
          python3 -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Install Lean
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          if [[ ! -x "$HOME/.elan/bin/elan" ]]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
              sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build libraries and local search
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean
          lake exe cache get
          lake build
          lake build repl
          lake build Physlib
          lake build Cslib
          lake build FloatLib
          lake build ActionSpeaksAll
          cd ..
          ./scripts/build-loogle.sh

      - name: Save Lean build
        if: steps.guard.outputs.run == 'true' && steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lean/.lake/build
            lean/.lake/packages/Physlib
            lean/.lake/packages/cslib
            lean/.lake/packages/floatlib
            lean/.lake/packages/repl
            vendor/loogle
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}

      - name: Test
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          .venv/bin/nox -s lint format types tests

      - name: Release
        if: steps.guard.outputs.run == 'true'
        env:
          GITEA_SERVER_URL: ${{ forgejo.server_url }}
          GITEA_TOKEN: ${{ forgejo.token }}
        run: .venv/bin/semantic-release version
