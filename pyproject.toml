[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "action-speaks"
description = "Machine-checked backing for an agent's mathematical claims, via Lean 4 + Mathlib"
readme = "README.md"
requires-python = ">=3.10"
# Apache 2.0 to match the stack this sits on: Lean 4, Mathlib, Physlib, Cslib and Loogle are
# all Apache 2.0, so results proved here can be contributed upstream to Mathlib without
# relicensing. FloatLib is MIT, which is compatible and imposes nothing on this project, but
# it means the graph is no longer single-licence — check before assuming that of a citation.
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["lean4", "mathlib", "theorem-proving", "verification", "llm", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dynamic = ["version"]

# Deliberately empty. The verifier drives Lean through a subprocess and speaks JSON-RPC and
# HTTP with the standard library alone, so installing it pulls in nothing. That keeps the
# trusted computing base to Lean's kernel, Mathlib and `lean/ActionSpeaks/Audit.lean` — adding a
# dependency here would widen it for no benefit.
dependencies = []

[project.optional-dependencies]
# `prek` runs the commit hooks in `.pre-commit-config.yaml`; `nox` runs the wider sessions in
# noxfile.py, each in its own environment; `pytest` runs the suite itself; `commitizen`
# validates commit messages; `python-semantic-release` cuts releases. Only contributors need
# any of them — none is imported by the package, so the trusted computing base is unaffected.
dev = [
    "prek>=0.2",
    "nox>=2025.5",
    "pytest>=8.0",
    "commitizen>=4.0",
    "python-semantic-release>=10.0",
]

[project.scripts]
action-speaks = "action_speaks.cli:main"

[tool.setuptools]
# Discovery rather than an explicit list, so that adding a subpackage cannot silently leave
# it out of the install.
[tool.setuptools.packages.find]
include = ["action_speaks*"]

[tool.setuptools.dynamic]
version = { attr = "action_speaks.__version__" }

[tool.commitizen]
# Conventional Commits, so a release tool can read the history rather than a human
# summarising it. Commitizen validates messages; it does not bump versions or write a
# changelog here. That belongs to one engine, and this is not it.
name = "cz_conventional_commits"
# The version lives in `action_speaks/__init__.py` and is read from there by
# `[tool.setuptools.dynamic]` above. Named here so the two cannot drift, not so that
# Commitizen bumps it.
version_provider = "pep621"
tag_format = "v$version"

# Below 1.0 a breaking change stays a minor bump: going to 2.0 on the first `!` would claim
# a stability this project has not offered yet. Revisit when it reaches 1.0.
major_version_zero = true

[tool.commitizen.customize]
# `feat` and `fix` are the releasing types. The rest describe work that changes no behaviour
# a user of the package can observe, and produce no version bump.
#
# Scopes are optional and free-form. A fixed list would go stale against a codebase that
# gains modules like `daemon` and `project_check` as it grows, and a scope nobody can
# remember gets guessed rather than chosen.

[tool.semantic_release]
# The sole version and changelog engine. Commitizen validates messages and must never bump:
# two engines produce disagreeing tags.
commit_parser = "conventional"
# `action_speaks/__init__.py` is the one version source; pyproject reads it via `attr` above.
version_variables = ["action_speaks/__init__.py:__version__"]
tag_format = "v{version}"
# Below 1.0 a breaking change is a minor bump, matching `major_version_zero` for Commitizen.
allow_zero_version = true
major_on_zero = false
# Not a PyPI distribution: the driver needs the built `lean/` beside its source, so there is
# nothing to build or upload here.
build_command = ""
upload_to_vcs_release = false
# The release commit has to pass our own commit-msg hook, and `chore` releases nothing, so
# it cannot trigger a second release.
commit_message = "chore(release): v{version}"
commit_author = "action-speaks release bot <action-speaks@localhost>"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.remote]
# Gitea is the authoritative origin; GitHub is a mirror and is not released to. The runner
# supplies its instance URL and job token. This instance deliberately uses HTTP.
type = "gitea"
domain = { env = "GITEA_SERVER_URL" }
token = { env = "GITEA_TOKEN" }
insecure = true

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore(\\(.*\\))?: ", "^ci(\\(.*\\))?: ", "^style(\\(.*\\))?: "]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `lean` marks the tests that need a built `lean/` checkout, whether for a Lean session, a
# `lake build`, or a local Loogle index. They dominate the runtime, so keeping them behind a
# marker is what makes a Lean-free run possible at all: `nox -s quick` selects `not lean`
# and finishes in under a second, while `nox -s tests` runs everything.
markers = [
    "lean: requires a built lean/ checkout (Lean session, lake build, or local Loogle)",
]

[tool.ruff]
# 100 rather than the usual 80. This codebase is unusually comment-heavy on purpose — the
# reasoning behind a check is the part worth keeping — and of the lines over 80 columns, 89%
# are comments and docstrings. `ruff format` does not reflow prose, so an 80-column limit
# would leave 335 violations that only hand-rewrapping could fix. Change this line to 80 and
# reflow if that trade ever looks worthwhile; nothing else depends on it.
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "N", "I", "NPY", "PL"]
ignore = [
    # Carried over as standing preferences.
    "PLC2401", "N802", "N806", "N813", "N818", "F722", "PLR0912", "PLR0915",

    # `from action_speaks import search as S`, `guard as G`, `verify as V`. Used consistently in
    # the CLI, the servers and the tests, where a one-letter module alias keeps call sites
    # readable.
    "N812",
    # Module-level singletons behind lazy initialisers (`_config`, `_ledger`, `_session`,
    # `_harness`, `_local_loogle`). A Lean session costs ~3 s and, with Mathlib, Physlib and
    # Cslib in the prelude, about 7.5 GB resident of which roughly 4 GB is private — the rest
    # is shared through the memory-mapped `.olean` files, which is why a second session costs
    # much less than the first. Measure with `grep -E '^(Rss|Pss):' /proc/<pid>/smaps_rollup`
    # on a warm `repl` process. So a session is created once per process and reused; that is
    # the design, not an oversight.
    "PLW0603",
    # The same judgment as the PLR0912/PLR0915 exclusions above, applied to the rest of the
    # family: the verification pipeline and the MCP dispatcher are wide by nature, and
    # splitting them to satisfy a counter would obscure the sequence of checks.
    "PLR0911", "PLR0913", "PLR0917",
    # `import` inside a function, used in exactly one place to break a config/search import
    # cycle.
    "PLC0415",
    # `line = line.strip()` and similar. Rebinding the loop variable is the clearest way to
    # write it.
    "PLW2901",
    # `subprocess.run` without `check=`: both sites inspect `returncode` immediately, which
    # is the point — a failed `git rev-parse` means "no revision", not an exception.
    "PLW1510",
    # Comparing against a small literal in a test assertion.
    "PLR2004",
]

[tool.mypy]
# Underscores, not hyphens. mypy silently rejects `ignore-missing-imports` in pyproject.toml
# ("Unrecognized option") and carries on with the setting unapplied.
ignore_missing_imports = true

[tool.pyright]
typeCheckingMode = "standard"
