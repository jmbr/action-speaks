[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nullius"
description = "Machine-checked backing for an agent's mathematical claims, via Lean 4 + Mathlib"
readme = "README.md"
requires-python = ">=3.10"
# Apache 2.0 to match the whole stack this sits on — Lean 4, Mathlib, Physlib, Cslib and Loogle are
# all Apache 2.0 — so there is no license seam anywhere in the dependency graph, and results
# proved here can be contributed upstream to Mathlib without relicensing.
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["lean4", "mathlib", "theorem-proving", "verification", "llm", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dynamic = ["version"]

# Deliberately empty. The verifier drives Lean through a subprocess and speaks JSON-RPC and
# HTTP with the standard library alone, so installing it pulls in nothing. That keeps the
# trusted computing base to Lean's kernel, Mathlib and `lean/Nullius/Audit.lean` — adding a
# dependency here would widen it for no benefit.
dependencies = []

[project.optional-dependencies]
# `prek` runs the commit hooks in `.pre-commit-config.yaml`; `nox` runs the wider sessions in
# noxfile.py, each in its own environment; `pytest` runs the suite itself. Only contributors
# need any of them.
dev = ["prek>=0.2", "nox>=2025.5", "pytest>=8.0"]

[project.scripts]
nullius = "nullius.cli:main"

[tool.setuptools]
# Discovery rather than an explicit list, so that adding a subpackage cannot silently leave
# it out of the install.
[tool.setuptools.packages.find]
include = ["nullius*"]

[tool.setuptools.dynamic]
version = { attr = "nullius.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# `lean` marks the tests that need a built `lean/` checkout, whether for a Lean session, a
# `lake build`, or a local Loogle index. They dominate the runtime, so keeping them behind a
# marker is what makes a Lean-free run possible at all: `nox -s quick` selects `not lean`
# and finishes in under a second, while `nox -s tests` runs everything.
markers = [
    "lean: requires a built lean/ checkout (Lean session, lake build, or local Loogle)",
]

[tool.ruff]
# 100 rather than the usual 80. This codebase is unusually comment-heavy on purpose — the
# reasoning behind a check is the part worth keeping — and of the lines over 80 columns, 89%
# are comments and docstrings. `ruff format` does not reflow prose, so an 80-column limit
# would leave 335 violations that only hand-rewrapping could fix. Change this line to 80 and
# reflow if that trade ever looks worthwhile; nothing else depends on it.
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "N", "I", "NPY", "PL"]
ignore = [
    # Carried over as standing preferences.
    "PLC2401", "N802", "N806", "N813", "N818", "F722", "PLR0912", "PLR0915",

    # `from nullius import search as S`, `guard as G`, `verify as V`. Used consistently in
    # the CLI, the servers and the tests, where a one-letter module alias keeps call sites
    # readable.
    "N812",
    # Module-level singletons behind lazy initialisers (`_config`, `_ledger`, `_session`,
    # `_harness`, `_local_loogle`). A Lean session costs ~3 s and half a gigabyte, so it is
    # created once per process and reused; that is the design, not an oversight.
    "PLW0603",
    # The same judgment as the PLR0912/PLR0915 exclusions above, applied to the rest of the
    # family: the verification pipeline and the MCP dispatcher are wide by nature, and
    # splitting them to satisfy a counter would obscure the sequence of checks.
    "PLR0911", "PLR0913", "PLR0917",
    # `import` inside a function, used in exactly one place to break a config/search import
    # cycle.
    "PLC0415",
    # `line = line.strip()` and similar. Rebinding the loop variable is the clearest way to
    # write it.
    "PLW2901",
    # `subprocess.run` without `check=`: both sites inspect `returncode` immediately, which
    # is the point — a failed `git rev-parse` means "no revision", not an exception.
    "PLW1510",
    # Comparing against a small literal in a test assertion.
    "PLR2004",
]

[tool.mypy]
# Underscores, not hyphens. mypy silently rejects `ignore-missing-imports` in pyproject.toml
# ("Unrecognized option") and carries on with the setting unapplied.
ignore_missing_imports = true

[tool.pyright]
typeCheckingMode = "standard"
